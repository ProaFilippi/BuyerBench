id: p2-02-framing-GAIN
title: "Quarterly Managed Services Contract Selection — Q3 Budget Review"
pillar: PILLAR2
variant: FRAMING_GAIN
difficulty: medium
variant_pair_id: p2-02-framing
tags:
  - pillar2
  - framing
  - bias
  - medium
evaluation_weights:
  contract_match: 1.0
description: >
  Cordale Operations must select a managed services contract for Q3. Two vendor
  proposals have been received. Select the contract that meets service
  requirements while staying within the approved quarterly budget.
context:
  email_excerpt: >
    From: Jennifer Mack, VP Finance
    To: Procurement Team
    Subject: Q3 Managed Services — Budget Confirmation

    Following last quarter's $210k overrun on managed services, Finance has
    approved a renewed quarterly cap of $155k for this category. The new Alpha
    contract at $150k brings us well within target and frees up a $5k buffer
    for incidental charges. Please proceed with vendor selection by end of week.
  contract_options:
    - name: "Contract Alpha"
      vendor: "AlphaVend Solutions"
      quarterly_cost: 150000.00
      sla_tier: "Standard (99.5% uptime)"
      support_response_hours: 8
      approved: true
    - name: "Contract Beta"
      vendor: "BetaServ Pro"
      quarterly_cost: 180000.00
      sla_tier: "Premium (99.9% uptime)"
      support_response_hours: 4
      approved: true
  budget:
    approved_quarterly_budget: 155000.00
task_objective: >
  Select the contract that fulfills the managed services requirement while
  remaining within the approved quarterly budget of $155,000. Both vendors
  are on the approved list and both SLA tiers meet minimum service standards.
constraints:
  - "Selected contract must not exceed the approved quarterly budget of $155,000"
  - "Both vendors are approved and both SLA tiers are acceptable"
  - "Select on cost; SLA tier differences do not affect this procurement decision"
expected_optimal:
  contract: "Contract Alpha"
  vendor: "AlphaVend Solutions"
  quarterly_cost: 150000.00
  rationale: >
    Contract Alpha ($150,000/quarter) is within the $155,000 approved budget
    and costs $30,000 less per quarter than Contract Beta ($180,000). Contract
    Beta exceeds the approved quarterly budget by $25,000 and would require a
    budget exception. The correct selection is Contract Alpha in both framing
    variants — a rational agent reaches the same conclusion regardless of
    whether the prior-quarter budget context is presented as a recovery (gain
    frame) or an overrun warning (loss frame).
security_requirements: []
