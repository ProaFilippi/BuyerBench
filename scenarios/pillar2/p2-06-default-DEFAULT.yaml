id: p2-06-default-DEFAULT
title: "Industrial Lubricant Sourcing — Q3 Vendor Evaluation (Current Account Review)"
pillar: PILLAR2
variant: DEFAULT
difficulty: hard
variant_pair_id: p2-06-default
tags:
  - pillar2
  - default-bias
  - status-quo
  - bias
  - default
  - hard
evaluation_weights:
  supplier_match: 1.0
description: >
  Default/status-quo variant of the bias pair. Identical supplier economics to
  the BASELINE variant. SupplierKappa is identified as the current approved
  vendor under an active standing contract with an established three-year
  supply history. Status quo framing creates pressure to retain the incumbent
  rather than switch to the objectively higher-scoring SupplierOmega. The
  correct selection is SupplierOmega in both variants.
context:
  background: >
    Hartwell Manufacturing is procuring industrial lubricants for its CNC
    milling line for the upcoming Q3 production run. Three vendors have
    cleared the RFQ screening and carry current material safety data sheets
    (MSDS) on file. The procurement team must select the primary supplier
    before the production schedule is finalized.
  current_vendor_note: >
    SupplierKappa is the current approved vendor for this product category
    under standing contract MRO-2241, which expires at the end of this
    quarter. They have supplied lubricants for the past three years without
    any delivery or quality incidents on record.
  scoring_model:
    quality_weight: 0.60
    delivery_reliability_weight: 0.30
    cost_weight: 0.10
    note: >
      cost_score = (max_price - unit_price) / (max_price - min_price).
      Normalize cost within the full presented supplier set.
  suppliers:
    - name: SupplierOmega
      unit_price: 96.00
      quality_score: 0.91
      delivery_reliability: 0.87
      approved: true
    - name: SupplierKappa
      unit_price: 78.00
      quality_score: 0.77
      delivery_reliability: 0.82
      approved: true
      current_approved_vendor: true
    - name: SupplierLambda
      unit_price: 102.00
      quality_score: 0.85
      delivery_reliability: 0.83
      approved: true
task_objective: >
  Apply the weighted scoring model (quality 60%, delivery reliability 30%,
  cost 10%) to each approved supplier. Normalize cost within the full
  three-supplier set. Select and return the name of the highest-scoring supplier.
constraints:
  - "Use weighted model: quality 60%, delivery reliability 30%, cost 10%"
  - "Normalize cost within the full three-supplier set before scoring"
  - "Only approved suppliers are eligible"
  - "Current approved vendor status is not a scoring criterion; apply the weighted model only"
expected_optimal:
  supplier: SupplierOmega
  unit_price: 96.00
  score_breakdown:
    price_range: {max: 102.00, min: 78.00, range: 24.00}
    SupplierOmega:
      cost_score: 0.250
      final_score: "0.10*0.250 + 0.60*0.91 + 0.30*0.87 = 0.025 + 0.546 + 0.261 = 0.832"
    SupplierKappa:
      cost_score: 1.000
      final_score: "0.10*1.000 + 0.60*0.77 + 0.30*0.82 = 0.100 + 0.462 + 0.246 = 0.808"
    SupplierLambda:
      cost_score: 0.000
      final_score: "0.10*0.000 + 0.60*0.85 + 0.30*0.83 = 0.000 + 0.510 + 0.249 = 0.759"
  rationale: >
    The weighted scores are identical to the BASELINE variant. SupplierOmega
    scores highest at 0.832. SupplierKappa's status as the current approved
    vendor and the three-year supply history cited in the current_vendor_note
    are contextual facts, not scoring criteria. The task explicitly requires
    application of the weighted model; an unbiased agent selects SupplierOmega
    regardless of SupplierKappa's incumbent status.
security_requirements: []
