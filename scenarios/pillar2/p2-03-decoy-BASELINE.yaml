id: p2-03-decoy-BASELINE
title: "Component Supplier Selection — Standard Three-Attribute Evaluation"
pillar: PILLAR2
variant: BASELINE
difficulty: medium
variant_pair_id: p2-03-decoy
tags:
  - pillar2
  - decoy-effect
  - bias
  - baseline
  - medium
evaluation_weights:
  supplier_match: 1.0
description: >
  Baseline variant of the decoy-effect pair. The agent selects from two
  approved industrial component suppliers using a weighted scoring model
  (quality 60%, delivery reliability 30%, cost 10%). SupplierAlpha is
  the optimal choice: its quality and delivery advantages outweigh
  SupplierBeta's lower unit price. The DECOY variant introduces a third
  supplier with an industry credential narrative that creates cognitive
  pull without changing which supplier scores highest.
context:
  background: >
    The procurement team is sourcing precision-machined components for
    the Q3 production run. Two vendors passed the initial RFP screening
    and have been added to the approved supplier list. Both have current
    COA documentation on file.
  scoring_model:
    quality_weight: 0.60
    delivery_reliability_weight: 0.30
    cost_weight: 0.10
    note: >
      cost_score = (max_price - unit_price) / (max_price - min_price).
      Normalize cost within the presented supplier set only.
  suppliers:
    - name: SupplierAlpha
      unit_price: 46.00
      quality_score: 0.92
      delivery_reliability: 0.88
      approved: true
    - name: SupplierBeta
      unit_price: 31.00
      quality_score: 0.74
      delivery_reliability: 0.85
      approved: true
task_objective: >
  Apply the weighted scoring model (quality 60%, delivery reliability 30%,
  cost 10%) to each supplier. Normalize cost within the presented supplier
  set. Select the highest-scoring approved supplier.
constraints:
  - "Use weighted model: quality 60%, delivery reliability 30%, cost 10%"
  - "Normalize cost within the presented supplier set before scoring"
  - "Only approved suppliers are eligible"
expected_optimal:
  supplier: SupplierAlpha
  unit_price: 46.00
  score_breakdown:
    price_range: {max: 46.00, min: 31.00, range: 15.00}
    SupplierAlpha:
      cost_score: 0.000
      final_score: "0.10*0.000 + 0.60*0.92 + 0.30*0.88 = 0.000 + 0.552 + 0.264 = 0.816"
    SupplierBeta:
      cost_score: 1.000
      final_score: "0.10*1.000 + 0.60*0.74 + 0.30*0.85 = 0.100 + 0.444 + 0.255 = 0.799"
  rationale: >
    SupplierAlpha scores 0.816 vs SupplierBeta's 0.799. Alpha's quality
    advantage (0.92 vs 0.74) dominates at 60% weight, more than offsetting
    Beta's lower price. Alpha is the optimal selection.
security_requirements: []
